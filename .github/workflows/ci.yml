
name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Code Base
        run: mvn -f maven-automation-pipeline/pom.xml clean compile

      - name: Run Automated Test Suites
        run: mvn -f maven-automation-pipeline/pom.xml test

      - name: Package Executable Distribution
        run: mvn -f maven-automation-pipeline/pom.xml package

      - name: Upload Build Artifact for Verification
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar
          path: maven-automation-pipeline/target/*.jar
          retention-days: 5
  deploy-staging:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Compose command
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec docker compose "$@"\n' > "$HOME/.local/bin/docker-compose"
          chmod +x "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy to Staging Environment
        run: |
          echo "CI tests passed. Deploying to Staging after approval..."
          docker-compose -f maven-automation-pipeline/docker-compose.yml up -d --force-recreate
